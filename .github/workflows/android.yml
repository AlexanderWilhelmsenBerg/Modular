name: Android CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Signing verifier tests
        run: python3 scripts/test-signing-verifier.py

      - name: Unit tests
        run: >
          gradle
          :module-api:testDebugUnitTest
          :module-sdk:testDebugUnitTest
          :app:testDebugUnitTest
          :reference-sort-alphabetical:testDebugUnitTest
          :addon-most-used:testDebugUnitTest
          --stacktrace

      - name: Lint
        run: >
          gradle
          :module-api:lintDebug
          :module-sdk:lintDebug
          :test-community-module:lintDebug
          :app:lintDebug
          :reference-sort-alphabetical:lintDebug
          :addon-most-used:lintDebug
          --stacktrace

      - name: Assemble debug and test APKs
        run: >
          gradle
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :reference-sort-alphabetical:assembleDebug
          :addon-most-used:assembleDebug
          :test-community-module:assembleDebug
          --stacktrace

      - name: Package public add-on SDK
        run: >
          gradle
          :module-api:publishReleasePublicationToSdkRepositoryRepository
          :module-sdk:publishReleasePublicationToSdkRepositoryRepository
          --stacktrace

      - name: Build independent SDK consumer
        run: >
          gradle -p examples/standalone-sort-addon
          -PmodularSdkRepository="$GITHUB_WORKSPACE/build/sdk-repository"
          :app:assembleDebug --stacktrace

      - name: Upload add-on SDK repository
        uses: actions/upload-artifact@v4
        with:
          name: modular-addon-sdk
          path: build/sdk-repository/
          if-no-files-found: error

      - name: Upload Core debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modular-core-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            module-api/build/reports/
            module-sdk/build/reports/
            test-community-module/build/reports/
            reference-sort-alphabetical/build/reports/
            addon-most-used/build/reports/

  ipc-smoke:
    env:
      MODULAR_KEYSTORE_PASSWORD: modular-ci-only
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Create disposable signing identities for variant checks
        env:
          MODULAR_KEYSTORE_PATH: ${{ runner.temp }}/modular-ci-signing.p12
        run: |
          echo "MODULAR_KEYSTORE_PATH=$MODULAR_KEYSTORE_PATH" >> "$GITHUB_ENV"
          bash scripts/create-ci-keystore.sh
          python3 scripts/verify-keystore.py --write-public "$RUNNER_TEMP/modular-ci-certificates.json"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cross-APK Binder smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            gradle :reference-sort-alphabetical:assembleDebug :reference-sort-alphabetical:assembleRelease :addon-most-used:assembleDebug :addon-most-used:assembleRelease :test-launcher-app:assembleDebug :test-community-module:assembleDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
            python3 scripts/verify-signed-apks.py --expected-certificates "$RUNNER_TEMP/modular-ci-certificates.json"
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r reference-sort-alphabetical/build/outputs/apk/debug/reference-sort-alphabetical-debug.apk
            adb install -r addon-most-used/build/outputs/apk/debug/addon-most-used-debug.apk
            adb install -r test-launcher-app/build/outputs/apk/debug/test-launcher-app-debug.apk
            adb install -r test-community-module/build/outputs/apk/debug/test-community-module-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-module-settings.py
            gradle :addon-most-used:connectedDebugAndroidTest :reference-sort-alphabetical:connectedDebugAndroidTest --stacktrace
            adb install -r reference-sort-alphabetical/build/outputs/apk/debug/reference-sort-alphabetical-debug.apk
            adb install -r addon-most-used/build/outputs/apk/debug/addon-most-used-debug.apk
            gradle :app:connectedDebugAndroidTest --stacktrace || { echo "=== Instrumentation XML ==="; find app/build/outputs/androidTest-results/connected -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true; echo "=== Recent logcat ==="; adb logcat -d -t 500 || true; exit 1; }

            python3 scripts/capture-home-v2.py

            adb install -r reference-sort-alphabetical/build/outputs/apk/release/reference-sort-alphabetical-release.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path io.github.alexanderwilhelmsenberg.modular
            adb shell pm path io.github.alexanderwilhelmsenberg.modular.debug

      - name: Remove disposable keystore
        if: always()
        run: rm -f -- "$MODULAR_KEYSTORE_PATH"

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            addon-most-used/build/reports/androidTests/
            reference-sort-alphabetical/build/reports/androidTests/

      - name: Upload settings screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-settings-screenshots
          path: build/ui-screenshots/
          if-no-files-found: warn


