name: Files focused device checks
on:
  push:
    branches: [ci/files-events-device-check]
permissions:
  contents: read
jobs:
  files-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Files and its test APK only
        run: gradle :addon-files:assembleDebug :addon-files:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all Files device tests without Core
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r addon-files/build/outputs/apk/debug/addon-files-debug.apk
            adb install -r addon-files/build/outputs/apk/androidTest/debug/addon-files-debug-androidTest.apk
            python3 scripts/run-files-device-tests.py
            test ! -d app/build/outputs/apk
      - name: Upload per-class Files test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-focused-device-reports
          path: build/reports/device/
