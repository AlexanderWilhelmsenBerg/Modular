name: Files focused device checks
on:
  push:
    branches: [ci/files-events-device-check]
permissions:
  contents: read
jobs:
  files-device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            image: '35'
          - api: 37
            image: '37.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Files and its test APK only
        run: gradle :addon-files:assembleDebug :addon-files:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Files foreground work, screen-off scan and process recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r addon-files/build/outputs/apk/debug/addon-files-debug.apk
            adb install -r addon-files/build/outputs/apk/androidTest/debug/addon-files-debug-androidTest.apk
            python3 scripts/run-files-device-tests.py
            python3 scripts/run-files-process-recovery.py
            test ! -d app/build/outputs/apk
      - name: Preserve crash diagnostics
        if: always()
        run: |
          mkdir -p build/reports/device
          timeout 10s adb logcat -d -b crash -v threadtime -t 1500 > build/reports/device/crash-buffer.txt || true
          timeout 10s adb shell run-as io.github.alexanderwilhelmsenberg.modular.addon.files.debug cat files/last-java-crash.json > build/reports/device/last-java-crash.json || true
      - name: Upload Files test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files-focused-device-reports-api${{ matrix.api }}
          path: build/reports/device/
