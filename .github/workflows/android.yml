name: Android CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          add-job-summary: on-failure

      - name: Compile production sources
        run: >
          gradle
          :module-api:compileDebugKotlin
          :app:compileDebugKotlin
          :reference-sort-alphabetical:compileDebugKotlin
          :reference-home-minimal:compileDebugKotlin
          :reference-drawer-basic:compileDebugKotlin
          --stacktrace

      - name: Unit tests
        run: >
          gradle
          :module-api:testDebugUnitTest
          :app:testDebugUnitTest
          :reference-sort-alphabetical:testDebugUnitTest
          :reference-home-minimal:testDebugUnitTest
          :reference-drawer-basic:testDebugUnitTest
          --stacktrace

      - name: Lint
        run: >
          gradle
          :module-api:lintDebug
          :app:lintDebug
          :reference-sort-alphabetical:lintDebug
          :reference-home-minimal:lintDebug
          :reference-drawer-basic:lintDebug
          --stacktrace

      - name: Assemble debug and test APKs
        run: >
          gradle
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :reference-sort-alphabetical:assembleDebug
          :reference-home-minimal:assembleDebug
          :reference-drawer-basic:assembleDebug
          --stacktrace

      - name: Upload development APKs
        uses: actions/upload-artifact@v7
        with:
          name: modular-development-apks-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            reference-home-minimal/build/outputs/apk/debug/reference-home-minimal-debug.apk
            reference-drawer-basic/build/outputs/apk/debug/reference-drawer-basic-debug.apk
            reference-sort-alphabetical/build/outputs/apk/debug/reference-sort-alphabetical-debug.apk

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml

  ipc-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          add-job-summary: on-failure

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate smoke script syntax
        run: bash -n scripts/ci/run-ipc-smoke.sh

      - name: Cross-APK Binder smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash scripts/ci/run-ipc-smoke.sh

      - name: Capture emulator state on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p build/ci-diagnostics
          adb devices -l > build/ci-diagnostics/adb-devices.txt 2>&1 || true
          adb shell getprop sys.boot_completed > build/ci-diagnostics/boot-completed.txt 2>&1 || true
          if [ ! -e build/ci-diagnostics/logcat.txt ]; then
            timeout 15s adb logcat -d -v threadtime -t 3000 > build/ci-diagnostics/logcat.txt 2>&1 || true
          fi

      - name: Upload emulator test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipc-smoke-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/ci-diagnostics/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
