name: Android CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Signing verifier tests
        run: python3 scripts/test-signing-verifier.py

      - name: Unit tests
        run: >
          gradle
          :module-api:testDebugUnitTest
          :module-sdk:testDebugUnitTest
          :app:testDebugUnitTest
          :reference-sort-alphabetical:testDebugUnitTest
          :addon-files:testDebugUnitTest
          :module-files-ui:testDebugUnitTest
          :addon-most-used:testDebugUnitTest
          --stacktrace

      - name: Lint
        run: >
          gradle
          :module-api:lintDebug
          :module-sdk:lintDebug
          :test-community-module:lintDebug
          :app:lintDebug
          :reference-sort-alphabetical:lintDebug
          :addon-files:lintDebug
          :module-files-ui:lintDebug
          :addon-most-used:lintDebug
          --stacktrace

      - name: Assemble debug and test APKs
        run: >
          gradle
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :reference-sort-alphabetical:assembleDebug
          :addon-files:assembleDebug
          :addon-files:assembleDebugAndroidTest
          :addon-most-used:assembleDebug
          :test-community-module:assembleDebug
          --stacktrace

      - name: Package public add-on SDK
        run: >
          gradle
          :module-api:publishReleasePublicationToSdkRepositoryRepository
          :module-sdk:publishReleasePublicationToSdkRepositoryRepository
          --stacktrace

      - name: Build independent SDK consumer
        run: >
          gradle -p examples/standalone-sort-addon
          -PmodularSdkRepository="$GITHUB_WORKSPACE/build/sdk-repository"
          :app:assembleDebug --stacktrace

      - name: Upload add-on SDK repository
        uses: actions/upload-artifact@v4
        with:
          name: modular-addon-sdk
          path: build/sdk-repository/
          if-no-files-found: error

      - name: Upload Core debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modular-core-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            module-api/build/reports/
            module-sdk/build/reports/
            test-community-module/build/reports/
            reference-sort-alphabetical/build/reports/
            addon-files/build/reports/
            module-files-ui/build/reports/
            addon-most-used/build/reports/

  ipc-smoke:
    env:
      MODULAR_KEYSTORE_PASSWORD: modular-ci-only
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Create disposable signing identities for variant checks
        env:
          MODULAR_KEYSTORE_PATH: ${{ runner.temp }}/modular-ci-signing.p12
        run: |
          echo "MODULAR_KEYSTORE_PATH=$MODULAR_KEYSTORE_PATH" >> "$GITHUB_ENV"
          bash scripts/create-ci-keystore.sh
          python3 scripts/verify-keystore.py --write-public "$RUNNER_TEMP/modular-ci-certificates.json"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cross-APK Binder smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            gradle :addon-files:assembleDebug :addon-files:assembleRelease :addon-files:assembleDebugAndroidTest :reference-sort-alphabetical:assembleDebug :reference-sort-alphabetical:assembleRelease :addon-most-used:assembleDebug :addon-most-used:assembleRelease :test-launcher-app:assembleDebug :test-community-module:assembleDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
            python3 scripts/verify-signed-apks.py --expected-certificates "$RUNNER_TEMP/modular-ci-certificates.json" --include-files
            adb install -r addon-files/build/outputs/apk/debug/addon-files-debug.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r reference-sort-alphabetical/build/outputs/apk/debug/reference-sort-alphabetical-debug.apk
            adb install -r addon-most-used/build/outputs/apk/debug/addon-most-used-debug.apk
            adb install -r test-launcher-app/build/outputs/apk/debug/test-launcher-app-debug.apk
            adb install -r test-community-module/build/outputs/apk/debug/test-community-module-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd package set-home-activity io.github.alexanderwilhelmsenberg.modular.debug/io.github.alexanderwilhelmsenberg.modular.MainActivity
            adb shell am force-stop com.google.android.apps.nexuslauncher
            python3 scripts/capture-module-settings.py
            adb install -r addon-files/build/outputs/apk/androidTest/debug/addon-files-debug-androidTest.apk
            python3 scripts/run-files-device-tests.py || { result=$?; mkdir -p build/reports/device; adb logcat -d -b crash -v threadtime -t 4000 > build/reports/device/logcat-crash.txt 2>&1 || true; adb logcat -d -b main -v threadtime -t 3000 2>/dev/null | awk '/AndroidRuntime|FATAL EXCEPTION|Fatal signal|TestRunner|InstrumentationResultPrinter|io[.]github[.]alexanderwilhelmsenberg[.]modular/' > build/reports/device/logcat-relevant.txt || true; touch build/reports/device/files-tests-failed; }
            gradle :addon-most-used:connectedDebugAndroidTest :reference-sort-alphabetical:connectedDebugAndroidTest --stacktrace || { result=$?; mkdir -p build/reports/device; adb logcat -d -b crash -v threadtime -t 4000 > build/reports/device/logcat-crash.txt 2>&1 || true; adb logcat -d -b main -v threadtime -t 3000 2>/dev/null | awk '/AndroidRuntime|FATAL EXCEPTION|Fatal signal|TestRunner|InstrumentationResultPrinter|io[.]github[.]alexanderwilhelmsenberg[.]modular/' > build/reports/device/logcat-relevant.txt || true; exit "$result"; }
            adb install -r reference-sort-alphabetical/build/outputs/apk/debug/reference-sort-alphabetical-debug.apk
            adb install -r addon-most-used/build/outputs/apk/debug/addon-most-used-debug.apk
            adb install -r addon-files/build/outputs/apk/debug/addon-files-debug.apk
            gradle :app:connectedDebugAndroidTest --stacktrace || { result=$?; mkdir -p build/reports/device build/ui-screenshots/home-v2 build/ui-screenshots/organization build/ui-screenshots/settings build/ui-screenshots/workspace; adb logcat -d -b crash -v threadtime -t 4000 > build/reports/device/logcat-crash.txt 2>&1 || true; adb logcat -d -b main -v threadtime -t 3000 2>/dev/null | awk '/AndroidRuntime|FATAL EXCEPTION|Fatal signal|TestRunner|InstrumentationResultPrinter|io[.]github[.]alexanderwilhelmsenberg[.]modular/' > build/reports/device/logcat-relevant.txt || true; adb pull /sdcard/Pictures/ModularHomeV2/. build/ui-screenshots/home-v2/ || true; adb pull /sdcard/Pictures/ModularOrganization/. build/ui-screenshots/organization/ || true; adb pull /sdcard/Pictures/ModularSettings/. build/ui-screenshots/settings/ || true; adb pull /sdcard/Pictures/ModularWorkspace/. build/ui-screenshots/workspace/ || true; exit "$result"; }

            mkdir -p build/ui-screenshots/organization
            adb pull /sdcard/Pictures/ModularOrganization/. build/ui-screenshots/organization/

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 scripts/check-search-transitions.py
            python3 scripts/capture-core-most-used.py
            adb shell cmd package set-home-activity io.github.alexanderwilhelmsenberg.modular.debug/io.github.alexanderwilhelmsenberg.modular.MainActivity
            adb shell am force-stop com.google.android.apps.nexuslauncher
            python3 scripts/capture-home-v2.py
            python3 scripts/capture-workspace.py
            python3 scripts/capture-settings.py
            python3 scripts/capture-files.py

            adb install -r reference-sort-alphabetical/build/outputs/apk/release/reference-sort-alphabetical-release.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path io.github.alexanderwilhelmsenberg.modular
            adb shell pm path io.github.alexanderwilhelmsenberg.modular.debug
            test ! -f build/reports/device/files-tests-failed

      - name: Remove disposable keystore
        if: always()
        run: rm -f -- "$MODULAR_KEYSTORE_PATH"

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            addon-files/build/reports/
            module-files-ui/build/reports/
            addon-files/build/reports/androidTests/
            addon-files/build/outputs/androidTest-results/
            app/build/outputs/androidTest-results/
            addon-most-used/build/outputs/androidTest-results/
            reference-sort-alphabetical/build/outputs/androidTest-results/
            addon-most-used/build/reports/androidTests/
            reference-sort-alphabetical/build/reports/androidTests/
            build/reports/device/
            build/reports/search-transitions.log

      - name: Upload settings screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-settings-screenshots
          path: build/ui-screenshots/
          if-no-files-found: warn


